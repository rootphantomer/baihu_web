name: auto-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (如 v2.1.0)'
        required: true
        type: string

jobs:
  check:
    name: 🔍 构建检查
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 打包需要完整历史（dist/ 内容依赖 index.html 引用，无 tag 需求但保持一致）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 📦 安装依赖
        run: yarn install --frozen-lockfile

      - name: 🔎 类型检查
        run: yarn type-check

      - name: 🧹 Lint 检查
        run: yarn lint

      - name: 🏗️ 构建
        run: yarn build

      - name: 📊 分析产物
        run: |
          # Vite 输出到 dist/js 与 dist/css（见 vite.config.ts 的 assetFileNames）
          RAW_KB=$(du -sk dist/ | cut -f1)
          GZIP_KB=$(tar -czf - dist/ 2>/dev/null | wc -c | awk '{printf "%d", $1/1024}')

          {
            echo "### 构建产物"
            echo ""
            echo "| 类型 | 大小 |"
            echo "|------|------|"
            echo "| 总大小 (uncompressed) | ${RAW_KB} KB |"
            echo "| 总大小 (gzip, tar.gz) | ${GZIP_KB} KB |"
            echo "| 压缩率 | $(awk "BEGIN{printf \"%.1f\", $GZIP_KB*100/$RAW_KB}")% |"
          } >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### JS 资源" >> $GITHUB_STEP_SUMMARY
          for f in dist/js/*.js; do
            [ -e "$f" ] || continue
            printf -- "- %s (%s → %s gzip)\n" \
              "$(basename "$f")" \
              "$(du -h "$f" | cut -f1)" \
              "$(gzip -c "$f" | wc -c | awk '{printf "%d", $1/1024}')KB" \
              >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### CSS 资源" >> $GITHUB_STEP_SUMMARY
          for f in dist/css/*.css; do
            [ -e "$f" ] || continue
            printf -- "- %s (%s → %s gzip)\n" \
              "$(basename "$f")" \
              "$(du -h "$f" | cut -f1)" \
              "$(gzip -c "$f" | wc -c | awk '{printf "%d", $1/1024}')KB" \
              >> $GITHUB_STEP_SUMMARY
          done

      - name: 📦 打包资源
        run: |
          tar -czf dist.tar.gz dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
          retention-days: 7

      - name: 🏷️ 确认版本
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  release:
    name: 🎉 发布 Release
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须拉取完整历史与 tag，否则 git describe 找不到上一个版本，
          # 会导致 changelog 退化为「列出全部提交」而遗漏本次变更
          fetch-depth: 0

      - name: 📜 生成更新日志
        id: changelog
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          CHANGELOG=$(cat << 'EOF'
          ## ✨ 更新亮点

          > ${{ github.event.head_commit.message || '请补充此版本的更新说明' }}

          ## 📋 详细变更

          EOF
          )

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG+=$'\n### 🚀 新功能\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^feat" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 🐛 Bug 修复\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^fix" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 🔧 重构与优化\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^refactor\|^perf\|^style" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 📝 文档\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^docs" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 🛠️ 其他\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^chore\|^ci\|^build\|^test" | sed 's/^/- /' || echo " 无")
          else
            CHANGELOG+=$(git log --oneline --no-decorate | sed 's/^/- /')
          fi

          echo "CHANGELOG<<EOF_DELIM" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF_DELIM" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: 🎉 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: '🎉 Release ${{ needs.check.outputs.tag }}'
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: dist.tar.gz
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
