name: auto-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (如 v2.1.0)'
        required: true
        type: string

jobs:
  check:
    name: 🔍 构建检查
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 📦 安装依赖
        run: yarn install --frozen-lockfile

      - name: 🔎 类型检查
        run: yarn type-check

      - name: 🧹 Lint 检查
        run: yarn lint

      - name: 🏗️ 构建
        run: yarn build

      - name: 📊 分析产物
        run: |
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 类型 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 总大小 (uncompressed) | $(du -sh dist/ | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| 总大小 (gzip) | $(du -sh dist/ | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### JS 资源" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/assets/*.js 2>/dev/null | awk '{printf "- %s (%s)\n", $NF, $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### CSS 资源" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/assets/*.css 2>/dev/null | awk '{printf "- %s (%s)\n", $NF, $5}' >> $GITHUB_STEP_SUMMARY

      - name: 📦 打包资源
        run: |
          tar -czf dist.tar.gz dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
          retention-days: 7

      - name: 🏷️ 确认版本
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  release:
    name: 🎉 发布 Release
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: 📜 生成更新日志
        id: changelog
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          CHANGELOG=$(cat << 'EOF'
          ## ✨ 更新亮点

          > ${{ github.event.head_commit.message || '请补充此版本的更新说明' }}

          ## 📋 详细变更

          EOF
          )

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG+=$'\n### 🚀 新功能\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^feat" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 🐛 Bug 修复\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^fix" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 🔧 重构与优化\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^refactor\|^perf\|^style" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 📝 文档\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^docs" | sed 's/^/- /' || echo " 无")
            CHANGELOG+=$'\n\n### 🛠️ 其他\n'
            CHANGELOG+=$(git log "$PREV_TAG..HEAD" --oneline --no-decorate --grep="^chore\|^ci\|^build\|^test" | sed 's/^/- /' || echo " 无")
          else
            CHANGELOG+=$(git log --oneline --no-decorate | sed 's/^/- /')
          fi

          echo "CHANGELOG<<EOF_DELIM" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF_DELIM" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: 🎉 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: '🎉 Release ${{ needs.check.outputs.tag }}'
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: dist.tar.gz
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
