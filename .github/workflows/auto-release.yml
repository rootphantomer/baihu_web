name: auto-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  tagged-release:
    name: 'Tagged Release'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 🛎️ 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的git历史记录

      - name: 📝 输出提交信息
        run: |
          echo "======================================"
          echo "🚀 触发 Release 工作流"
          echo "分支: ${{ github.ref }}"
          echo "Tag: ${{ github.ref_name }}"
          echo "提交者: ${{ github.actor }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"
          echo "提交时间: ${{ github.event.head_commit.timestamp }}"
          echo "======================================"

      - name: 📜 生成更新日志
        run: |
          # 获取上一个标签
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 生成更新日志
          echo "## 📝 更新内容" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -z "$PREV_TAG" ]; then
            # 如果没有先前的标签，获取所有提交记录
            echo "### 🔄 完整提交记录" >> CHANGELOG.md
            git log --pretty=format:"* %s %n  - 提交者: %an%n  - 提交时间: %ad%n  - 提交ID: %h%n" --date=format:"%Y-%m-%d %H:%M:%S" >> CHANGELOG.md
          else
            # 获取从上一个标签到现在的提交记录
            echo "### 🔄 更新记录 ($PREV_TAG -> ${{ github.ref_name }})" >> CHANGELOG.md
            git log --pretty=format:"* %s %n  - 提交者: %an%n  - 提交时间: %ad%n  - 提交ID: %h%n" --date=format:"%Y-%m-%d %H:%M:%S" $PREV_TAG..HEAD >> CHANGELOG.md
          fi

      - name: 🎉 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: '🎉 Release ${{ github.ref_name }}'
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
